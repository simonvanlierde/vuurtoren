name: Browser preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: browser preview build
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.14"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          package-json-file: frontend/package.json
          runtime: node@26
          cache: true
          cache-dependency-path: frontend/pnpm-lock.yaml
          install: false
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build:browser
        working-directory: frontend
        env:
          VITE_BASE: /vuurtoren/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: src/vuurtoren/static

  # The same lifecycle as a web app's previews: docs/hosting.md#pull-request-previews in the template.
  # Fork pull requests never get the token, so they skip with a notice, as does a repo
  # without the secret.
  preview:
    name: "site: preview"
    # Bot pull requests (Renovate, Dependabot, the update App) get no preview, and a bot's
    # push does not start one. A person's later ready or reopen deploys the head as it is.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.head_ref != 'chore/copier-update' && !endsWith(github.event.pull_request.user.login, '[bot]') && !endsWith(github.actor, '[bot]')
    # Shares the site job of preview-retire.yml, so a retire waits for a deploy in flight.
    concurrency:
      group: preview-site-${{ github.event.pull_request.number }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    steps:
      # For deploy-worker.sh and wrangler.site.jsonc. The page itself comes from the build job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: '"$GITHUB_WORKSPACE/.github/scripts/cloudflare-gate.sh" Preview'

      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "12.16.1"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - if: steps.gate.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      # GitHub Pages serves the site under /vuurtoren/, so the preview does too, and its
      # root redirects there. Search engines should index the production site, not the
      # preview copies.
      - if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p _site/vuurtoren
          tar -xf "$RUNNER_TEMP/pages/artifact.tar" -C _site/vuurtoren
          printf '/ /vuurtoren/ 302\n' > _site/_redirects
          printf '/*\n  X-Robots-Tag: noindex\n' > _site/_headers

      - if: steps.gate.outputs.run == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # The same week's wait as a package's own installs: dlx resolves wrangler's
          # dependencies without a lockfile, here with the token in reach.
          WRANGLER: pnpm --config.minimum-release-age=10080 dlx wrangler@4.154.0
        run: |-
          # This job may have queued behind a close or a draft switch: a retire that
          # ran first must not be undone by a deploy.
          state=$(gh api "repos/$REPO/pulls/$PR" --jq '.state + " " + (.draft|tostring)')
          if [ "$state" != "open false" ]; then
            echo "::notice::Preview skipped: pull request $PR is no longer open and ready ($state)."
            exit 0
          fi
          "$GITHUB_WORKSPACE/.github/scripts/deploy-worker.sh" Preview "vuurtoren-site-pr-$PR" --config wrangler.site.jsonc
