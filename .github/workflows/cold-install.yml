name: cold install

# Run the first Quick start block in a fresh container, then check the local server.
on:
  pull_request:
    paths: [README.md, .github/workflows/cold-install.yml, Justfile, "frontend/package.json", "frontend/pnpm-lock.yaml", "**/pyproject.toml", "**/uv.lock", "**/.python-version"]
  schedule:
    - cron: "47 5 * * 1" # Mondays, 05:47 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README commands, fresh container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Debian with git, curl and a C compiler, like a new contributor's machine. Pinned
    # to a digest, so a moved tag can't swap the image. Renovate bumps it; Dependabot
    # doesn't read workflow images, so with Dependabot it moves on `copier update`.
    container: buildpack-deps:trixie@sha256:5214476af627916270063c9f99a969381f32cd961c861ea95e740ba71abc125f
    env:
      # As in python.yml: uv checks every package against OSV's malware advisories before
      # its code runs. The preview flag only silences the "experimental" warning.
      UV_MALWARE_CHECK: "1"
      UV_PREVIEW_FEATURES: malware-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The tools the README's "You need" sentence names, and nothing more.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # The weekly run saves the cache; a pull request only reads it.
          save-cache: ${{ github.event_name != 'pull_request' }}
          version: "0.13.6"
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          package-json-file: frontend/package.json
          runtime: node@26
          install: false

      - name: Run the README's Quick start commands
        shell: bash
        run: |
          awk '/^## /{quick = ($0 == "## Quick start")}
               quick && /^```/{code = !code && /^```(sh|bash|shell)[[:space:]]*$/; if (!code && started) exit; next}
               quick && code {started = 1; if ($0 !~ /^uv run vuurtoren/) print}' README.md >"$RUNNER_TEMP/readme.sh"
          test -s "$RUNNER_TEMP/readme.sh"
          chown -R "$(id -u):$(id -g)" .
          bash -ex "$RUNNER_TEMP/readme.sh"
          uv run vuurtoren >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/
