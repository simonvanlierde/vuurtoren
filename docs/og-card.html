<script>
  const P = JSON.parse(document.getElementById("plan").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("chart");
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.append(e);
    return e;
  };
  if (P.fi) {
    const fiDate = new Date(P.fi + "T00:00:00Z");
    document.getElementById("fi").textContent = fiDate.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });

    // One x per month, so the FI month lands where the lighthouse stands.
    const PX = 3.8, X0 = -4;
    const i = P.m.indexOf(P.fi);
    const fx = X0 + i * PX;
    const n = Math.min(P.m.length, Math.ceil((1204 - X0) / PX) + 1);
    const top = 255, base = 750;
    const vmax = P.nw[n - 1];
    const y = (v) => base - (v / vmax) * (base - top);
    const xs = (k) => X0 + k * PX;
    const pts = (arr) => arr.slice(0, n).map((v, k) => [xs(k), y(v)]);
    const path = (p) => "M" + p.map(([a, b]) => a.toFixed(1) + " " + b.toFixed(1)).join("L");

    const nw = pts(P.nw), p10 = pts(P.p10), p50 = pts(P.p50), p90 = pts(P.p90);

    const defs = el("defs", {});
    const g = el("linearGradient", { id: "beam", gradientUnits: "userSpaceOnUse" }, defs);
    const fyy = y(P.nw[i]);
    const s = 4.7, tx = fx - 20 * s, ty = fyy - 56 * s;
    const lampX = tx + 20 * s, lampY = ty + 20.5 * s;
    g.setAttribute("x1", lampX); g.setAttribute("x2", 1200); g.setAttribute("y1", lampY); g.setAttribute("y2", lampY);
    for (const [o, c, a] of [[0, "#ffe9b8", 0.95], [0.18, "#ffb020", 0.7], [1, "#ffb020", 0]]) el("stop", { offset: o, "stop-color": c, "stop-opacity": a }, g);
    const fade = el("linearGradient", { id: "under", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el("stop", { offset: 0, "stop-color": "#0b1b2b", "stop-opacity": 1 }, fade);
    el("stop", { offset: 1, "stop-color": "#0b1b2b", "stop-opacity": 0.35 }, fade);

    // Uncertainty band, as the app draws it: a translucent amber beam around the median.
    el("path", { d: path(p90) + "L" + p10.slice().reverse().map(([a, b]) => a.toFixed(1) + " " + b.toFixed(1)).join("L") + "Z", fill: "#ffb020", "fill-opacity": 0.13 });
    // Ground under the fixed-return line.
    el("path", { d: path(nw) + `L${xs(n - 1)} 640 L${X0} 640Z`, fill: "url(#under)" });
    el("path", { d: path(p50), fill: "none", stroke: "#ffb020", "stroke-width": 3, "stroke-dasharray": "9 7" });
    el("path", { d: path(nw), fill: "none", stroke: "#f7f9fb", "stroke-width": 4, "stroke-linejoin": "round" });

    // The lighthouse mark (frontend/src/assets/vuurtoren.svg), scaled, standing on the FI month.
    const L = 1200 - lampX;
    el("path", { d: `M${lampX + 7 * s} ${lampY - 1.5 * s}L1200 ${lampY - 0.30 * L}L1200 ${lampY + 0.20 * L}Z`, fill: "url(#beam)" });
    const m = el("g", { transform: `translate(${tx} ${ty}) scale(${s})` });
    const tower = el("g", { fill: "#f7f9fb", stroke: "#f7f9fb", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round" }, m);
    el("path", { d: "M15 56 L18.5 26 H23.5 L25 56 Z" }, tower);
    el("path", { d: "M12 56 H28" }, tower);
    el("path", { d: "M16.5 26 H23.5" }, tower);
    el("circle", { cx: 20, cy: 20.5, r: 3.6, fill: "#ffb020" }, m);
  }
