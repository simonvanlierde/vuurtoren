<script>
  const P = JSON.parse(document.getElementById("plan").textContent);
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("chart");
  const el = (tag, attrs, parent = svg) => {
    const e = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    parent.append(e);
    return e;
  };
  if (P.fi) {
    const fiDate = new Date(P.fi + "T00:00:00Z");
    document.getElementById("fi").textContent = fiDate.toLocaleDateString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });

    // x is time, one step per month from today at the lamp. y is euros in today's money,
    // linear from zero: the lamp stands at today's net worth and the shoreline at the FIRE number.
    const PX = 2.8, X0 = 104, LAMP_Y = 282, SHORE_Y = 150, TOWER = 7, HORIZON = 304, LAMP_CY = 22.4;
    const n = Math.min(P.m.length, Math.ceil((1204 - X0) / PX) + 1);
    const i = P.m.indexOf(P.fi);
    const k = (LAMP_Y - SHORE_Y) / (P.fire - P.p50[0]);
    const y0 = LAMP_Y + P.p50[0] * k;
    const y = (v) => y0 - v * k;
    const xs = (j) => X0 + j * PX;
    const at = (arr) => arr.slice(0, n).map((v, j) => [xs(j), y(v)]);
    const d = (pts) => pts.map(([a, b]) => a.toFixed(1) + " " + b.toFixed(1)).join("L");
    // A band between two edges, each a fraction of the way from the median to its percentile.
    const band = (f) => {
      const hi = P.p50.map((m, j) => m + f * (P.p90[j] - m));
      const lo = P.p50.map((m, j) => m - f * (m - P.p10[j]));
      return "M" + d(at(hi)) + "L" + d(at(lo).reverse()) + "Z";
    };

    const defs = el("defs", {});
    // Dusk sky over a sea, from the dusk tokens in DESIGN.md: deep at the top, horizon at the horizon,
    // from dusk-sea back to deep at the bottom edge.
    const sky = el("linearGradient", { id: "sky", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el("stop", { offset: 0, "stop-color": "var(--dusk-deep)" }, sky);
    el("stop", { offset: 1, "stop-color": "var(--dusk-horizon)" }, sky);
    const sea = el("linearGradient", { id: "sea", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el("stop", { offset: 0, "stop-color": "var(--dusk-sea)" }, sea);
    el("stop", { offset: 1, "stop-color": "var(--dusk-deep)" }, sea);
    el("rect", { width: 1200, height: HORIZON, fill: "url(#sky)" });
    el("rect", { y: HORIZON, width: 1200, height: 630 - HORIZON, fill: "url(#sea)" });
    el("path", { d: `M0 ${HORIZON}H1200`, stroke: "#f7f9fb", "stroke-opacity": 0.22, "stroke-width": 2 });
    // The light holds to the shoreline, then dissolves: the beam ends where the plan arrives.
    const fade = el("linearGradient", { id: "fade", gradientUnits: "userSpaceOnUse", x1: X0, x2: 1200, y1: 0, y2: 0 }, defs);
    const fx = (xs(i) - X0) / (1200 - X0);
    el("stop", { offset: 0, "stop-color": "#fff", "stop-opacity": 1 }, fade);
    el("stop", { offset: fx, "stop-color": "#fff", "stop-opacity": 0.85 }, fade);
    el("stop", { offset: Math.min(1, fx + 0.25), "stop-color": "#fff", "stop-opacity": 0.25 }, fade);
    el("stop", { offset: 1, "stop-color": "#fff", "stop-opacity": 0 }, fade);
    const rise = el("linearGradient", { id: "rise", gradientUnits: "userSpaceOnUse", x1: 0, x2: 0, y1: 0, y2: 90 }, defs);
    el("stop", { offset: 0, "stop-color": "#000" }, rise);
    el("stop", { offset: 1, "stop-color": "#fff" }, rise);
    const top = el("mask", { id: "top", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1200, height: 630 }, defs);
    el("rect", { width: 1200, height: 630, fill: "url(#rise)" }, top);
    const mask = el("mask", { id: "along", maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1200, height: 630 }, defs);
    el("rect", { width: 1200, height: 630, fill: "url(#fade)" }, mask);

    // Light-cone: nested bands stack up, so it is brightest at the median and fades towards
    // the 10th and 90th percentile edges.
    const cone = el("g", { mask: "url(#top)" });
    const inner = el("g", { mask: "url(#along)" }, cone);
    for (let step = 28; step >= 1; step--) {
      const f = step / 28;
      el("path", { d: band(f), fill: f > 0.45 ? "#ffb020" : "#ffe9b8", "fill-opacity": 0.05 }, inner);
    }

    // The FIRE number as a shoreline, and where the fixed-return plan reaches it.
    el("path", { d: `M${X0} ${y(P.fire)}H1200`, stroke: "#f7f9fb", "stroke-opacity": 0.4, "stroke-width": 2, "stroke-dasharray": "2 8", "stroke-linecap": "round" });
    const lines = el("g", { mask: "url(#top)" });
    el("path", { d: "M" + d(at(P.fixed)), fill: "none", stroke: "#f7f9fb", "stroke-opacity": 0.8, "stroke-width": 2, "stroke-linejoin": "round" }, lines);
    el("path", { d: "M" + d(at(P.p50)), fill: "none", stroke: "#ffe9b8", "stroke-width": 4, "stroke-linejoin": "round", "stroke-linecap": "round" }, lines);
    el("circle", { cx: xs(i), cy: y(P.fire), r: 26, fill: "none", stroke: "#ffe9b8", "stroke-opacity": 0.35, "stroke-width": 2 });
    el("circle", { cx: xs(i), cy: y(P.fire), r: 13, fill: "var(--dusk-deep)", stroke: "#f7f9fb", "stroke-width": 4 });

    // The lighthouse mark (frontend/src/assets/vuurtoren.svg), its lamp at today's net worth.
    const s = TOWER, tx = X0 - 20 * s, ty = LAMP_Y - LAMP_CY * s;
    // The rock it stands on: a dark headland breaking the horizon, so the tower has ground.
    const foot = LAMP_Y + (56 - LAMP_CY) * s + 2;
    el("path", { d: `M0 630V${foot + 30}C50 ${foot + 10} ${X0 - 130} ${foot - 4} ${X0 - 60} ${foot - 4}H${X0 + 60}C${X0 + 150} ${foot - 4} 250 ${foot + 20} 330 630Z`, fill: "#071019" });
    const m = el("g", { transform: `translate(${tx} ${ty}) scale(${s})` });
    const tower = el("g", { fill: "#f7f9fb", stroke: "#f7f9fb", "stroke-width": 1.8, "stroke-linecap": "round", "stroke-linejoin": "round" }, m);
    el("path", { d: "M15 56 L18.5 26 H23.5 L25 56 Z" }, tower);
    el("path", { d: "M12 56 H28" }, tower);
    el("path", { d: "M16.5 26 H23.5" }, tower);
    el("circle", { cx: 20, cy: LAMP_CY, r: 3.6, fill: "#ffe9b8" }, m);
