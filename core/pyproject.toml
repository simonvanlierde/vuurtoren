[build-system]
requires = ["maturin>=1.12,<2"]
build-backend = "maturin"

[project]
name = "vuurtoren-core"
version = "0.1.0"
requires-python = ">=3.14"
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
build = ["maturin>=1.12,<2", "pyodide-build==0.39.3"]

[tool.maturin]
bindings = "pyo3"
module-name = "vuurtoren_core"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }, { file = "src/**/*.rs" }]
