# US tax figures — policyengine/OpenFisca parameter shape, one file per
# country, keyed by USTaxConfig field. Hand-maintained: edit here (the source of
# truth), then run the gate. status/verified_on are this repo's provenance
# extensions carried alongside each value.
# EVERY MONEY FIGURE BELOW IS DENOMINATED IN USD.

