# AT tax figures — policyengine/OpenFisca parameter shape, one file per
# country, keyed by ATTaxConfig field. Hand-maintained: edit here (the source of
# truth), then run the gate. status/verified_on are this repo's provenance
# extensions carried alongside each value.
# EVERY MONEY FIGURE BELOW IS DENOMINATED IN EUR.

employee_credit:
  description: Verkehrsabsetzbetrag, the flat employee tax credit.
  unit: currency-EUR
  reference: https://www.arbeiterkammer.at/beratung/steuerundeinkommen/wassich2026aendert/Steuerwertetabelle_2026.pdf
  values:
    2026-01-01: {value: 496, status: final, verified_on: 2026-07-28}

