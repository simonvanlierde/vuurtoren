xfail:
  voordeel: >-
    The published fictief rendement does not follow from the page's own 2025 method (berekening-box-3-inkomen-2025, aandeel truncated to two decimals). 80,000 x 5.88% = EUR 4,704; aandeel 22,316 / 80,000 = 27.89%; voordeel
    EUR 1,311, not the published EUR 1,238. The engine gives EUR 1,312.18.
    Rechecked 2026-10-21: the page (last modified 2026-04-01) still publishes this figure. It matches the 2026 figures instead (6.00%, heffingsvrij vermogen EUR 59,357): 4,800 x 25.80% = EUR 1,238.
