xfail:
  voordeel: >-
    The Belastingdienst truncates the aandeel to two decimals and rounds each rendement to whole euros. Art. 5.2 Wet IB 2001 uses the exact ratio, as the engine does. Page: aandeel 32.15% per partner (exact 32.1536%) and rendement
    EUR 15,925 give EUR 5,119; the engine gives EUR 5,120.53 per partner.
    Rechecked 2026-10-21: Art. 5.2(1)-(2) Wet IB 2001 sets the voordeel as rendement / rendementsgrondslag x grondslag sparen en beleggen, with no rounding, and the pages' own instruction changes by year (2 decimals for 2023 and 2025, 3 for 2024; the 2026 page says 3 in its method and 2 in its examples). The engine is right; the page is a convention.
  belasting: >-
    Follows from the voordeel: the page taxes EUR 5,119 (EUR 1,842); the engine
    EUR 5,120.53 (EUR 1,843.39 per partner).
