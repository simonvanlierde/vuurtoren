title: Rekenvoorbeeld 2026 met verschillende soorten vermogen, zonder fiscale partner
source: https://www.belastingdienst.nl/wps/wcm/connect/nl/box-3/content/berekening-box-3-inkomen-2026
retrieved: 2026-10-21
tax_year: 2026
fiscal_partners: false
share: "1"
# Investments are EUR 75,000 of beleggingen plus a second home in NL at WOZ EUR 200,000.
inputs: {bank: "150000", investments: "275000", debt: "100000"}
published: {voordeel: 12964, belasting: 4667}
engine: {voordeel: "12966.21"}
xfail:
  voordeel: >-
    The Belastingdienst truncates the aandeel to two decimals and rounds each rendement to whole euros. Art. 5.2 Wet IB 2001 uses the exact ratio, as the engine does. Page: aandeel 81.94% (exact 81.947%) and debt rendement EUR 2,598
    (exact 2,597.40) give EUR 12,964; the engine gives EUR 12,966.21.
    Rechecked 2026-10-21: Art. 5.2(1)-(2) Wet IB 2001 sets the voordeel as rendement / rendementsgrondslag x grondslag sparen en beleggen, with no rounding, and the pages' own instruction changes by year (2 decimals for 2023 and 2025, 3 for 2024; the 2026 page says 3 in its method and 2 in its examples). The engine is right; the page is a convention.
    The page has also changed its own rounding: in July 2026 (Wayback snapshot of 21 July) it
    gave the debt rendement as EUR 2,597 and the voordeel as EUR 12,965.
