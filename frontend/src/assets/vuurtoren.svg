<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" color="#0B1B2B">
  <title>vuurtoren</title>
  <!-- The lighthouse mark: tower, lamp, beam — nothing else. Strokes are
       currentColor (defaulting to ink navy via the root color attribute) so the one
       file serves paper and night-sea grounds; beacon amber belongs to the beam and
       lamp alone, as fills, which is what keeps the mark legible at favicon size. -->
  <path d="M27 19 L62 7 L62 34 Z" fill="#FFB020"/>
  <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 56 H28"/>
    <path d="M15 56 L18.5 26"/>
    <path d="M25 56 L21.5 26"/>
    <path d="M16.5 26 H23.5"/>
  </g>
  <circle cx="20" cy="20.5" r="3.4" fill="#FFB020"/>
</svg>
