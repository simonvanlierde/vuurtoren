<!doctype html>
<html lang="en">
  <head>
    <script>
      // Mirrors src/lib/theme.ts — key "vuurtoren-theme", class "dark" on <html>.
      // Storage can refuse access (private mode, blocked site data): fall back to the system.
      let t = null;
      try {
        t = localStorage.getItem("vuurtoren-theme");
      } catch {}
      const dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    </script>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: the fixed bottom nav pads itself with env(safe-area-inset-bottom),
         which only reports a real value once the page opts into the display cutout area. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Lighthouse mark, ink navy + beacon amber — no binary asset, no favicon.ico 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Absolute URLs: link previews do not resolve relative ones, and Vite leaves meta content alone. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="vuurtoren" />
    <meta property="og:url" content="https://simonvanlierde.com/vuurtoren/" />
    <meta property="og:image" content="https://simonvanlierde.com/vuurtoren/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vuurtoren's Plan view for a made-up household: a financial independence date of December 2044, a FIRE number of 750,000 euros and a rising green net worth chart." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>vuurtoren</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
